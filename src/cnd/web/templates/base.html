<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block titulo %}CND{% endblock %}</title>
<style>
  :root{
    --branco:#ffffff;
    --papel:#fcfcfd;      /* faixas e cabeçalhos de tabela */
    --linha:#e6e8eb;
    --linha-2:#d0d4d9;
    --texto:#16191d;
    --texto-2:#5a626b;
    --texto-3:#8b939c;
    --azul:#1f4e79;       --azul-fraco:#eef3f9;
    --verde:#1a6b42;      --verde-fraco:#eaf5ef;
    --ambar:#8a5a00;      --ambar-fraco:#fdf4e3;
    --vermelho:#a3261a;   --vermelho-fraco:#fdeeec;
    --r:5px;
    --mono:"Cascadia Mono",Consolas,"SF Mono",monospace;
  }
  *{box-sizing:border-box}
  body{
    margin:0;background:var(--branco);color:var(--texto);
    font:13.5px/1.5 "Segoe UI Variable Text","Segoe UI",Inter,system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  a{color:var(--azul);text-underline-offset:2px}

  /* ---------- cabeçalho ---------- */
  .topo{border-bottom:1px solid var(--linha);position:sticky;top:0;z-index:10;background:var(--branco)}
  .topo-1{display:flex;align-items:center;gap:.85rem;padding:.7rem 1.5rem .55rem}
  .logo{
    width:24px;height:24px;border-radius:5px;background:var(--azul);color:#fff;
    display:grid;place-items:center;font-size:10.5px;font-weight:700;letter-spacing:.02em;
  }
  .nome{font-size:14.5px;font-weight:600;letter-spacing:-.005em}
  .org{font-size:12px;color:var(--texto-3);padding-left:.85rem;border-left:1px solid var(--linha)}
  .abas{display:flex;gap:.15rem;padding:0 1.5rem}
  .abas a{
    padding:.45rem .8rem;font-size:13px;color:var(--texto-2);text-decoration:none;
    border-bottom:2px solid transparent;font-weight:500;
  }
  .abas a:hover{color:var(--texto)}
  .abas a.ativo{color:var(--azul);border-bottom-color:var(--azul);font-weight:600}

  .ferramentas{
    display:flex;align-items:center;gap:.75rem;flex-wrap:wrap;
    padding:.6rem 1.5rem;background:var(--papel);border-top:1px solid var(--linha);
    border-bottom:1px solid var(--linha);font-size:12.5px;color:var(--texto-2);
  }
  .ferramentas label{display:inline-flex;align-items:center;gap:.4rem;color:var(--texto-3);font-size:12px}
  .direita{margin-left:auto;display:flex;gap:.4rem;align-items:center}

  main{padding:1.25rem 1.5rem 3rem;max-width:1560px}

  /* ---------- títulos ---------- */
  h1{font-size:19px;font-weight:600;margin:0;letter-spacing:-.015em}
  .sub{font-size:12.5px;color:var(--texto-3);margin:.15rem 0 0}
  .titulo-pagina{margin-bottom:1.1rem}
  .rotulo{font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--texto-3)}

  /* ---------- painéis ---------- */
  .painel{border:1px solid var(--linha);border-radius:var(--r);background:var(--branco);overflow:hidden;margin-bottom:1rem}
  .painel-topo{
    display:flex;align-items:center;justify-content:space-between;gap:1rem;
    padding:.7rem .9rem;border-bottom:1px solid var(--linha);background:var(--papel);
  }
  .painel-topo h2{font-size:13px;font-weight:600;margin:0}
  .painel-corpo{padding:.9rem}
  .colunas{display:grid;gap:1rem;grid-template-columns:repeat(auto-fit,minmax(440px,1fr))}
  .controles{display:flex;align-items:center;gap:.45rem;flex-wrap:wrap}

  /* ---------- resumo numérico ---------- */
  .metricas{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));
            border-top:1px solid var(--linha)}
  .metrica{padding:.7rem .9rem;border-right:1px solid var(--linha)}
  .metrica:last-child{border-right:0}
  .metrica .n{font-size:19px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.02em;line-height:1.25}
  .metrica .t{font-size:11.5px;color:var(--texto-2);margin-top:.1rem}
  .metrica.destaque{background:var(--verde-fraco)} .metrica.destaque .n{color:var(--verde)}
  .metrica.atencao .n{color:var(--ambar)}
  .metrica.falha .n{color:var(--vermelho)}
  .metrica.zero .n{color:var(--texto-3)}

  /* ---------- progresso ---------- */
  .progresso{display:flex;height:6px;border-radius:99px;background:var(--linha);overflow:hidden}
  .progresso i{display:block;height:100%;transition:width .6s ease}
  .progresso i.ok{background:var(--verde)} .progresso i.erro{background:var(--vermelho)}
  .legenda-progresso{display:flex;justify-content:space-between;font-size:12px;margin-bottom:.4rem}
  .legenda-progresso b{font-variant-numeric:tabular-nums;font-weight:600}

  /* ---------- estados ---------- */
  .estado{display:inline-flex;align-items:center;gap:.4rem;white-space:nowrap;font-size:12.5px}
  .estado::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--texto-3);flex:0 0 6px}
  .estado.ok{color:var(--verde)}       .estado.ok::before{background:var(--verde)}
  .estado.alerta{color:var(--ambar)}   .estado.alerta::before{background:var(--ambar)}
  .estado.erro{color:var(--vermelho)}  .estado.erro::before{background:var(--vermelho)}
  .estado.ativo{color:var(--azul)}     .estado.ativo::before{background:var(--azul)}
  .selo{
    display:inline-block;padding:.1rem .45rem;border-radius:3px;font-size:11.5px;
    font-weight:600;background:var(--papel);border:1px solid var(--linha);color:var(--texto-2);
  }
  .selo.ok{background:var(--verde-fraco);border-color:transparent;color:var(--verde)}
  .selo.alerta{background:var(--ambar-fraco);border-color:transparent;color:var(--ambar)}
  .selo.erro{background:var(--vermelho-fraco);border-color:transparent;color:var(--vermelho)}
  .selo.info{background:var(--azul-fraco);border-color:transparent;color:var(--azul)}

  /* ---------- tabelas ---------- */
  .rolagem{overflow-x:auto}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{
    text-align:left;padding:.5rem .75rem;background:var(--papel);
    border-bottom:1px solid var(--linha);font-size:11px;font-weight:600;
    letter-spacing:.04em;text-transform:uppercase;color:var(--texto-3);white-space:nowrap;
  }
  td{padding:.5rem .75rem;border-bottom:1px solid var(--linha)}
  tbody tr:last-child td{border-bottom:0}
  tbody tr:hover{background:var(--papel)}
  .num{text-align:right;font-variant-numeric:tabular-nums}
  table.ficha td:first-child{width:38%;color:var(--texto-2);font-size:12.5px}
  table.ficha td:last-child{font-weight:500}
  .mono{font-family:var(--mono);font-size:12px}

  /* ---------- controles ---------- */
  button,.botao{
    font:12.5px/1.4 inherit;font-weight:500;
    padding:.36rem .75rem;border:1px solid var(--linha-2);border-radius:4px;
    background:var(--branco);color:var(--texto);cursor:pointer;
    text-decoration:none;display:inline-flex;align-items:center;gap:.35rem;
  }
  button:hover,.botao:hover{background:var(--papel);border-color:var(--texto-3)}
  button.primario{background:var(--azul);border-color:var(--azul);color:#fff}
  button.primario:hover{background:#18406a;border-color:#18406a}
  input,select{
    font:12.5px inherit;padding:.32rem .45rem;border:1px solid var(--linha-2);
    border-radius:4px;background:var(--branco);color:var(--texto);
  }
  input:focus,select:focus{outline:none;border-color:var(--azul);box-shadow:0 0 0 3px var(--azul-fraco)}
  form{margin:0;display:inline}

  .alerta-caixa{
    display:flex;gap:.6rem;align-items:flex-start;
    border:1px solid var(--linha);border-left:3px solid var(--vermelho);
    border-radius:var(--r);background:var(--vermelho-fraco);
    padding:.7rem .9rem;margin-bottom:1rem;font-size:13px;
  }
  .dica{font-size:12px;color:var(--texto-3);margin:.5rem 0 0}
  .vazio{padding:2.25rem 1rem;text-align:center;color:var(--texto-3);font-size:13px}
  .vazio b{display:block;color:var(--texto-2);margin-bottom:.2rem}
</style>
</head>
<body>
<header class="topo">
  <div class="topo-1">
    <span class="logo">CND</span>
    <span class="nome">Emissão de Certidões</span>
    <span class="org">Mapah Auditoria e Contabilidade</span>
  </div>
  <nav class="abas">
    <a href="/" class="{{ 'ativo' if pagina == 'painel' }}">Acompanhamento</a>
    <a href="/jobs" class="{{ 'ativo' if pagina == 'jobs' }}">Itens</a>
    <a href="/saude" class="{{ 'ativo' if pagina == 'saude' }}">Diagnóstico</a>
  </nav>
  {% block ferramentas %}{% endblock %}
</header>
<main>{% block conteudo %}{% endblock %}</main>
</body>
</html>
