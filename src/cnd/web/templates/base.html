<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block titulo %}ACTA{% endblock %}</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<header class="topo">
  <div class="topo-1">
    <a class="marca" href="/">
      <span class="marca-simbolo" aria-hidden="true">
        <svg viewBox="0 0 64 64">
          <path fill="#FCB817" d="M52.5 12.8Q51.2 37.1 42.2 51.2Q32 37.1 12.8 37.1Z"/>
        </svg>
      </span>
      <span class="marca-texto">
        <span class="nome">ACTA</span>
        <span class="org">Certidões · Mapah</span>
      </span>
    </a>
    <nav class="abas">
      <a href="/" class="{{ 'ativo' if pagina == 'painel' }}">Operação</a>
      <a href="/jobs" class="{{ 'ativo' if pagina == 'jobs' }}">Carteira</a>
      <a href="/saude" class="{{ 'ativo' if pagina == 'saude' }}">Diagnóstico</a>
    </nav>
    <div class="ambiente">
      <span class="versao">v{{ versao_acta }}</span>
    </div>
  </div>
  {% block ferramentas %}{% endblock %}
</header>
<main>{% block conteudo %}{% endblock %}</main>
</body>
</html>
