{% extends "base.html" %}
{% set pagina = 'painel' %}
{% set body_class = 'tela-maquinas' %}
{% block titulo %}Máquinas - ACTA{% endblock %}

{% block conteudo %}
<div id="resumo" data-maquina="{{ selecionada_idx if selecionada_idx is not none else '' }}"
     data-arquivo="{{ arquivo_escolhido if arquivo_escolhido is not none else '' }}">
  {% include "_cards.html" %}
</div>

<script>
  const indiceMaquina = document.getElementById('resumo').dataset.maquina;
  const arquivoEscolhido = document.getElementById('resumo').dataset.arquivo;

  function fixarLinkDoPainel() {
    const atual = new URL(window.location.href);
    const limpo = new URL(window.location.href);
    limpo.searchParams.delete('mensagem');
    limpo.searchParams.delete('erro');
    if (limpo.toString() !== atual.toString()) {
      window.history.replaceState({}, document.title, limpo.pathname + limpo.search);
    }
  }

  function rotaFragmento() {
    // A planilha escolhida acompanha a recarga automática. Sem isso, a cada
    // 5 segundos a tela voltaria sozinha para a que o robô está fazendo,
    // no meio de uma conferência de outra.
    const params = new URLSearchParams();
    if (indiceMaquina !== '') params.set('maquina', indiceMaquina);
    if (arquivoEscolhido !== '') params.set('arquivo', arquivoEscolhido);
    const consulta = params.toString();
    return '/fragmento/resumo' + (consulta ? '?' + consulta : '');
  }

  function formatarTempo(ms) {
    if (ms <= 0) return 'retomando agora';
    const total = Math.ceil(ms / 1000);
    const h = Math.floor(total / 3600);
    const m = Math.floor((total % 3600) / 60);
    const s = total % 60;
    if (h) return h + 'h ' + String(m).padStart(2, '0') + 'min';
    if (m) return m + 'min ' + String(s).padStart(2, '0') + 's';
    return s + 's';
  }

  function formatarHoraLocal(iso) {
    const data = new Date(iso || '');
    if (!Number.isFinite(data.getTime())) return 'sem horário';
    return data.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
  }

  function atualizarContadores() {
    document.querySelectorAll('[data-countdown]').forEach(function (el) {
      const fim = Date.parse(el.dataset.countdown || '');
      if (!Number.isFinite(fim)) {
        el.textContent = 'sem horário';
        return;
      }
      el.textContent = formatarTempo(fim - Date.now());
    });
    document.querySelectorAll('[data-retoma-hora]').forEach(function (el) {
      el.textContent = formatarHoraLocal(el.dataset.retomaHora);
    });
  }

  function origemPadraoAtualizacao() {
    const salva = {{ origem_atualizacao_padrao|default('')|tojson }};
    const propriaMaquina = 'http://' + window.location.hostname + ':8899';
    const origemSalva = salva && salva !== propriaMaquina ? salva : '';
    return localStorage.getItem('actaOrigemAtualizacao') ||
      origemSalva ||
      'http://100.125.207.8:8899';
  }

  function pedirOrigemAtualizacao() {
    const origem = prompt('Origem da atualização', origemPadraoAtualizacao());
    if (!origem) return '';
    const limpa = origem.trim().replace(/\/+$/, '');
    if (limpa) localStorage.setItem('actaOrigemAtualizacao', limpa);
    return limpa;
  }

  function destinoComMensagem(texto) {
    const destino = new URL(window.location.href);
    destino.searchParams.set('mensagem', texto);
    destino.searchParams.delete('erro');
    return destino.toString();
  }

  function avisarErro(erro) {
    const destino = new URL(window.location.href);
    destino.searchParams.set('erro', erro.message || String(erro));
    destino.searchParams.delete('mensagem');
    window.location.href = destino.toString();
  }

  function mensagemDaApi(corpo, fallback) {
    return (corpo && (corpo.mensagem || corpo.situacao)) || fallback;
  }

  document.addEventListener('click', function (evento) {
    const botao = evento.target.closest('[data-api-action]');
    if (!botao) return;
    evento.preventDefault();
    botao.disabled = true;
    botao.dataset.originalHtml = botao.innerHTML;
    const texto = botao.querySelector('span');
    if (texto) texto.textContent = 'Aguarde';
    else botao.textContent = 'Aguarde';
    fetch(botao.dataset.apiAction, { method: 'POST', credentials: 'same-origin' })
      .then(function (resposta) {
        if (!resposta.ok) return resposta.json().then(function (corpo) {
          throw new Error(corpo.detail || 'Comando recusado');
        });
        return resposta.json();
      })
      .then(function (corpo) {
        window.location.href = destinoComMensagem(
          mensagemDaApi(corpo, 'Comando aceito.')
        );
      })
      .catch(function (erro) {
        botao.disabled = false;
        botao.innerHTML = botao.dataset.originalHtml || botao.dataset.label;
        avisarErro(erro);
      });
  });

  setInterval(atualizarContadores, 1000);
  fixarLinkDoPainel();
  atualizarContadores();

  setInterval(function () {
    if (document.hidden) return;
    fetch(rotaFragmento())
      .then(function (r) { return r.ok ? r.text() : null; })
      .then(function (html) {
        if (!html) return;
        document.getElementById('resumo').innerHTML = html;
        atualizarContadores();
      })
      .catch(function () {});
  }, 5000);
</script>
{% endblock %}
